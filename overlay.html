<!doctype html>
<html lang="vi" class="overlay-root">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nguồn OBS · Bông Hoa Live</title>
  <link rel="stylesheet" href="overlay.css?v=20261122b">
  <script src="hieu-ung-data.js?v=20261122b" defer></script>
  <script src="hieu-ung.js?v=20261122b" defer></script>

</head>
<body>
  <main>
    <div id="stage">
      <canvas id="flower" width="480" height="530" aria-label="Nhân vật Bông Hoa" role="img"></canvas>
      <section id="live-card" hidden>
        <strong id="live-card-title"></strong>
        <div id="live-card-tally"></div>
      </section>
      <div id="caption" class="speech-bubble" hidden>
        <div class="bubble-inner">
          <div id="caption-text"></div>
        </div>
        <div class="bubble-tail"></div>
        <div id="caption-page" class="bubble-page" hidden></div>
      </div>
    </div>
  </main>
  <button id="unlock" hidden>🔔 Bật âm thanh · Bông Hoa</button>
</body>
</html>
